<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Personagem RPG</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    
    <form>
        
        <h1>Criação de Personagem</h1>
        <fieldset>
            <legend>Informações Básicas</legend>

            <label for="nome">Nome:</label><br>
            <input type="text" id="nome" name="nome"><br><br>

            <label for="idade">Idade:</label><br>
            <input type="number" id="idade" name="idade"><br><br>

            <label for="classe">Classe:</label><br>
            <select id="classe" name="classe">
                <option>Guerreiro</option>
                <option>Mago</option>
                <option>Arqueiro</option>
                <option>Ladino</option>
                <option>Clérigo</option>
            </select><br><br>

            <label for="raca">Raça:</label><br>
            <select id="raca" name="raca">
                <option>Humano</option>
                <option>Elfo</option>
                <option>Anão</option>
                <option>Orc</option>
                <option>Draconato</option>
            </select>

        </fieldset>

        <br>

        <fieldset>
            <legend>Atributos</legend>

            <label>Força</label>
            <input type="number" min="1" max="20"><br><br>

            <label>Destreza</label>
            <input type="number" min="1" max="20"><br><br>

            <label>Inteligência</label>
            <input type="number" min="1" max="20"><br><br>

            <label>Constituição</label>
            <input type="number" min="1" max="20"><br><br>

            <label>Carisma</label>
            <input type="number" min="1" max="20"><br><br>

            <label>Sabedoria</label>
            <input type="number" min="1" max="20">

        </fieldset>

        <br>

        <fieldset>
            <legend>Habilidades</legend>

            <input type="checkbox" id="espada">
            <label for="espada">Espadachim</label><br>

            <input type="checkbox" id="magia">
            <label for="magia">Magia</label><br>

            <input type="checkbox" id="furtividade">
            <label for="furtividade">Furtividade</label><br>

            <input type="checkbox" id="cura">
            <label for="cura">Cura</label><br>

        </fieldset>

        <br>

        <fieldset>
            <legend>Equipamento Inicial</legend>

            <input type="radio" id="espadaRadio" name="arma">
            <label for="espadaRadio">Espada</label><br>

            <input type="radio" id="arcoRadio" name="arma">
            <label for="arcoRadio">Arco</label><br>

            <input type="radio" id="cajadoRadio" name="arma">
            <label for="cajadoRadio">Cajado</label>

        </fieldset>

        <br>

        <fieldset>
            <legend>História</legend>

            <textarea rows="6" cols="50" placeholder="Conte a história do seu personagem..."></textarea>
        </fieldset>

        <br>

        <input type="submit" value="Criar Personagem">
        <input type="reset" value="Limpar">

    </form>

</body>
</html>
